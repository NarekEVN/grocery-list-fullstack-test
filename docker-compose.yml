version: '3.9'

services:

  db:
    image: postgres:15-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: grocery_list
      POSTGRES_USER: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d grocery_list"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://admin:password1@db:5432/grocery_list
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-make-it-long-and-random-at-least-32-characters
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-in-production
      - JWT_REFRESH_EXPIRES_IN=2h
      - GROCERY_PAGE_SIZE=10
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    command: sh -c "yarn prisma migrate deploy && yarn prisma db seed && yarn start:dev"

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  postgres_data:
